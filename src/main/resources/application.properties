spring.application.name=sistema-gimnasio
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.datasource.url=jdbc:h2:mem:testdb

# Desactiva la creación automática de Hibernate para que no interfiera
spring.jpa.hibernate.ddl-auto=none

# Indica a Spring Boot que ejecute siempre los scripts de inicialización SQL
spring.sql.init.mode=always

# Lee schema.sql y data.sql como UTF-8 (evita textos como "Plan BÃ¡sico")
spring.sql.init.encoding=UTF-8

# Fuerza UTF-8 en peticiones y respuestas HTTP
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true